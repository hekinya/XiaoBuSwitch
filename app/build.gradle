plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}
android {
    namespace 'io.github.xiaoaiswitch'
    compileSdk 36
    defaultConfig {
        applicationId 'io.github.xiaobuiswitch'
        minSdk 27
        targetSdk 35
        versionCode 2
        versionName '0.2.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    signingConfigs {
        release {
            def propsFile = rootProject.file('keystore.properties')
            def props = new Properties()
            if (propsFile.exists()) {
                propsFile.withInputStream { props.load(it) }
            }
            def keystorePath = System.getenv('KEYSTORE_FILE') ?: props.getProperty('storeFile')
            if (keystorePath) {
                storeFile file(keystorePath)
                storePassword System.getenv('KEYSTORE_PASSWORD') ?: props.getProperty('storePassword')
                keyAlias System.getenv('KEY_ALIAS') ?: props.getProperty('keyAlias')
                keyPassword System.getenv('KEY_PASSWORD') ?: props.getProperty('keyPassword')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (signingConfigs.release.storeFile != null) {
                signingConfig signingConfigs.release
            }
        }
    }
    buildFeatures { compose true; buildConfig true }
    lint { abortOnError true }
}
kotlin { jvmToolchain(17) }
dependencies {
    implementation project(':core')
    implementation 'androidx.activity:activity-compose:1.12.4'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.10.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
    implementation 'top.yukonga.miuix.kmp:miuix-android:0.8.7'
    compileOnly 'de.robv.android.xposed:api:82'
}
